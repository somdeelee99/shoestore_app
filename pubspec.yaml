name: shoestore_app
description: ShoeStore — ຮ້ານຂາຍເກີບ (Flutter + GetX + MVVM)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.2

  # API
  dio: ^5.9.0
  connectivity_plus: ^7.3.1

  # UI / Responsive
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0

  # Images
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  flutter_image_compress: ^2.3.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Date / Localization
  intl: ^0.20.2

  # Authentication
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  pinput: ^5.0.1
  intl_phone_number_input: ^0.7.4

  # Push Notifications (optional)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^22.3.2

  # Realtime Chat (optional)
  socket_io_client: ^3.1.2

  # Logging / App Information
  logger: ^2.8.0
  package_info_plus: ^8.3.0

  # Payment (optional)
  flutter_stripe: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png
    - assets/logo/logo_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: assets/logo/logo.png

flutter_native_splash:
  color: "#111827"
  image: assets/logo/logo.png
  android_12:
    color: "#111827"
    image: assets/logo/logo.png
